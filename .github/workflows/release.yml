name: windows-x64-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Download lightweight AI model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/002_lightweightSR_DIV2K_s64w8_SwinIR-S_x2.onnx?download=true" -OutFile "dist/models/swin2SR-lightweight-x2-64.onnx"
      - name: Package
        shell: pwsh
        run: |
          Copy-Item "target/x86_64-pc-windows-msvc/release/4k-rust-camera.exe" "dist/4k-rust-camera.exe"
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "4k-rust-camera-windows-x64.zip" -Force
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: 4K Rust Camera v0.1.0
          generate_release_notes: true
          files: 4k-rust-camera-windows-x64.zip
