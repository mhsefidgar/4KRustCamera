name: windows-x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build virtual camera DLL
        shell: pwsh
        run: |
          msbuild virtual-camera/VirtualCameraMediaSource.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$pwd\\dist\\" 

      - name: Build Rust application
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/k4-rust-camera.exe" "dist/4k-rust-camera.exe"
          Copy-Item "dist/4KRustCameraVirtualCamera.dll" "dist/4KRustCameraVirtualCamera.dll" -Force
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "4k-rust-camera-windows-x64.zip" -Force

      - name: Upload CI artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: 4k-rust-camera-windows-x64
          path: 4k-rust-camera-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 4K Rust Camera ${{ github.ref_name }}
          generate_release_notes: true
          files: 4k-rust-camera-windows-x64.zip
